interface:
  display_name: "Writing AGENTS.md"
  short_description: "Generate or update AGENTS.md (with validation + rubric checks)"
  default_prompt: "Use $writing-agents-md to generate or update the requested agent context files at ./; do not create CLAUDE.md unless requested or necessary for a requested import. Inspect existing files first, detect stack/commands/constraints with a small, targeted read budget, and preserve valid curated content. An explicit creation/update request authorizes local writes after inspection and validation without another approval; ask only for a substantive curated conflict, destructive overwrite, out-of-scope file, or external action not requested. Validate against the SKILL.md checklist, run a rubric self-check using `references/agents-md-rubric.md`, fix P1/P2 issues, and keep within the line budget."
